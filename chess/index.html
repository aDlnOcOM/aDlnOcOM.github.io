<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шахматы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="wrap">
    <div id="status">Ваш ход</div>
    <div id="board" aria-label="Шахматная доска"></div>
    <div id="thinking" aria-live="polite"></div>
    <div id="controls">
      <button id="switch" type="button">Сменить сторону</button>
      <button id="restart" type="button">Заново</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
