<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шахматы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="wrap">
    <header class="game-header">
      <h1>Шахматы</h1>
      <div class="header-actions">
        <button id="settings-toggle" class="icon-button" type="button" aria-controls="settings" aria-expanded="false" aria-label="Открыть настройки" title="Настройки">⚙</button>
      </div>
    </header>
    <section id="settings" class="settings" aria-label="Настройки партии" hidden>
      <output id="level-indicator" aria-live="polite" hidden>Уровень 1 из 10</output>
      <div id="settings-controls" class="settings-controls" hidden>
        <label class="setting-control" for="difficulty">
          <span>Сложность соперника</span>
          <select id="difficulty">
            <option value="0">01 · Новичок</option>
            <option value="1">02 · Любитель</option>
            <option value="2">03 · Практик</option>
            <option value="3">04 · Тактик</option>
            <option value="4">05 · Стратег</option>
            <option value="5">06 · Эксперт</option>
            <option value="6">07 · Мастер</option>
            <option value="7">08 · Элитный</option>
            <option value="8">09 · Гроссмейстер</option>
            <option value="9">10 · Легенда</option>
            <option value="10">11 · Алекс</option>
            <option value="11">12 · Леотис</option>
          </select>
        </label>
        <label class="setting-control" for="theme">
          <span>Тема доски</span>
          <select id="theme">
            <option value="midnight">Полночь</option>
            <option value="ivory">Классика</option>
            <option value="forest">Лес</option>
            <option value="ember">Уголь и янтарь</option>
            <option value="contrast">Высокий контраст</option>
          </select>
        </label>
      </div>
    </section>
    <div class="game-workspace">
      <section class="board-column" aria-label="Игровое поле">
        <div id="status">Ваш ход</div>
        <div id="board" role="grid" aria-label="Шахматная доска"></div>
        <div id="thinking" aria-live="polite"></div>
        <div id="controls">
          <button id="switch" type="button">Сменить сторону</button>
          <button id="restart" type="button">Заново</button>
        </div>
      </section>
      <aside class="move-history" aria-labelledby="history-title">
        <div class="history-heading">
          <h2 id="history-title">История партии</h2>
          <output id="move-count" aria-live="polite">0 ходов</output>
        </div>
        <ol id="move-list" class="move-list" aria-label="Список ходов">
          <li class="history-empty">Пока ходов нет</li>
        </ol>
        <div id="replay-controls" class="replay-controls" aria-label="Просмотр завершённой партии" hidden>
          <button id="replay-first" type="button" aria-label="К началу партии" title="К началу">«</button>
          <button id="replay-previous" type="button" aria-label="Предыдущий ход" title="Предыдущий ход">‹</button>
          <output id="replay-position" aria-live="polite">Финальная позиция</output>
          <button id="replay-next" type="button" aria-label="Следующий ход" title="Следующий ход">›</button>
          <button id="replay-last" type="button" aria-label="К финальной позиции" title="К финалу">»</button>
        </div>
      </aside>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
