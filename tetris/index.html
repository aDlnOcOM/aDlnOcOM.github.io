<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitHub TETRIS | aDlnOcOM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Courier New", monospace;
      color: #c9d1d9;
    }
    #game {
      display: flex;
      gap: 20px;
    }
    canvas {
      border: 2px solid #30363d;
      image-rendering: pixelated;
    }
    #stats {
      background: #161b22;
      padding: 20px;
      border-radius: 6px;
      border: 1px solid #30363d;
      min-width: 220px;
    }
    #stats h2 { margin-bottom: 10px; font-size: 16px; }
    #stats div { margin: 8px 0; }
    .label { color: #8b949e; }
    .value { color: #58a6ff; font-weight: bold; }

    /* Leaderboard */
    #leaderboard {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #30363d;
    }
    #leaderboard h3 {
      margin-bottom: 10px;
      font-size: 14px;
      color: #8b949e;
    }
    #leaderboard ol {
      padding-left: 20px;
      font-size: 12px;
      max-height: 250px;
      overflow-y: auto;
    }
    #leaderboard li {
      margin: 5px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb-name { color: #58a6ff; }
    .lb-score { color: #2ea043; }
    .lb-date { color: #8b949e; font-size: 10px; display: block; }

    /* Modal */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    #modal-content {
      background: #161b22;
      padding: 30px;
      border-radius: 8px;
      border: 2px solid #30363d;
      text-align: center;
      max-width: 350px;
      width: 90%;
    }
    #modal-content h2 {
      margin-bottom: 15px;
      color: #f0f6fc;
    }
    #modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 4px;
      font-family: inherit;
    }
    #modal-content button {
      padding: 10px 20px;
      margin: 5px;
      background: #2ea043;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
    #modal-content button:hover {
      background: #3fb950;
    }
    #loading {
      color: #8b949e;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="board"></canvas>
    <div id="stats">
      <h2>📊 Stats</h2>
      <div><span class="label">Score:</span> <span class="value" id="score">0</span></div>
      <div><span class="label">Lines:</span> <span class="value" id="lines">0</span></div>
      <div><span class="label">Level:</span> <span class="value" id="level">1</span></div>

      <div id="leaderboard">
        <h3>🏆 Global Leaderboard</h3>
        <ol id="lb-list"><li id="loading">Loading...</li></ol>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="modal">
    <div id="modal-content">
      <h2>GAME OVER</h2>
      <p>Final Score: <span id="final-score" style="color:#2ea043;font-weight:bold;">0</span></p>
      <input type="text" id="player-name" placeholder="Enter your nickname" maxlength="12" />
      <button onclick="saveScore()">Save Record</button>
      <button onclick="restartGame()" style="background:#388bfd;">Play Again</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    // === FIREBASE CONFIG ===
    // ВСТАВЬ СЮДА СВОЙ КОНФИГ ИЗ FIREBASE CONSOLE!
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
  apiKey: "AIzaSyCJu7xKBuR_bVal7P2CFGmy5DeVvR2VQGs",
  authDomain: "githubleaderboard-adlnocom.firebaseapp.com",
  databaseURL: "https://githubleaderboard-adlnocom-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "githubleaderboard-adlnocom",
  storageBucket: "githubleaderboard-adlnocom.firebasestorage.app",
  messagingSenderId: "547100842018",
  appId: "1:547100842018:web:ae8d07584a81cb9f22d27b",
  measurementId: "G-10793GQHSE"
};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // === TETRIS ENGINE ===
    const COLS = 10, ROWS = 20, SIZE = 24;
    const board = document.getElementById("board");
    board.width = COLS * SIZE;
    board.height = ROWS * SIZE;
    const ctx = board.getContext("2d");

    const COLORS = {
      bg: "#0d1117",
      grid: "#161b22",
      I: "#2ea043",
      O: "#8b5cf6",
      T: "#f0f6fc",
      S: "#238636",
      Z: "#a371f7",
      J: "#388bfd",
      L: "#f78166"
    };

    const SHAPES = {
      I: [[1,1,1,1]],
      O: [[1,1],[1,1]],
      T: [[0,1,0],[1,1,1]],
      S: [[0,1,1],[1,1,0]],
      Z: [[1,1,0],[0,1,1]],
      J: [[1,0,0],[1,1,1]],
      L: [[0,0,1],[1,1,1]]
    };

    let grid, score, lines, level, gameOver;
    let current, next, posX, posY;
    let lastDrop = 0, dropInterval = 1000;

    function init() {
      grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
      score = 0; lines = 0; level = 1;
      gameOver = false;
      current = next || randomShape();
      next = randomShape();
      posX = Math.floor((COLS - current.shape[0].length) / 2);
      posY = 0;
      lastDrop = 0;
      dropInterval = 1000;
      updateStats();
    }

    function randomShape() {
      const keys = Object.keys(SHAPES);
      const key = keys[Math.floor(Math.random() * keys.length)];
      return { shape: SHAPES[key], color: COLORS[key] };
    }

    function collide(nx = posX, ny = posY, shape = current.shape) {
      for (let y = 0; y < shape.length; y++) {
        for (let x = 0; x < shape[y].length; x++) {
          if (shape[y][x]) {
            const bx = nx + x, by = ny + y;
            if (bx < 0 || bx >= COLS || by >= ROWS || (by >= 0 && grid[by][bx])) return true;
          }
        }
      }
      return false;
    }

    function rotate() {
      const rotated = current.shape[0].map((_, i) =>
        current.shape.map(row => row[i]).reverse()
      );
      if (!collide(posX, posY, rotated)) current.shape = rotated;
    }

    function drop() {
      if (!collide(posX, posY + 1)) {
        posY++;
      } else {
        lock();
        clearLines();
        if (!gameOver) {
          current = next;
          next = randomShape();
          posX = Math.floor((COLS - current.shape[0].length) / 2);
          posY = 0;
          if (collide()) {
            gameOver = true;
            showGameOver();
          }
        }
      }
    }

    function lock() {
      current.shape.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val && posY + y >= 0) grid[posY + y][posX + x] = current.color;
        });
      });
    }

    function clearLines() {
      let cleared = 0;
      for (let y = ROWS - 1; y >= 0; y--) {
        if (grid[y].every(cell => cell)) {
          grid.splice(y, 1);
          grid.unshift(Array(COLS).fill(0));
          cleared++;
          y++;
        }
      }
      if (cleared) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared] * level;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(100, 1000 - (level - 1) * 100);
        updateStats();
      }
    }

    function updateStats() {
      document.getElementById("score").textContent = score;
      document.getElementById("lines").textContent = lines;
      document.getElementById("level").textContent = level;
    }

    function draw() {
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, board.width, board.height);

      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * SIZE, 0);
        ctx.lineTo(x * SIZE, board.height);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * SIZE);
        ctx.lineTo(board.width, y * SIZE);
        ctx.stroke();
      }

      grid.forEach((row, y) => {
        row.forEach((cell, x) => {
          if (cell) {
            ctx.fillStyle = cell;
            ctx.fillRect(x * SIZE, y * SIZE, SIZE - 1, SIZE - 1);
          }
        });
      });

      if (!gameOver) {
        current.shape.forEach((row, y) => {
          row.forEach((val, x) => {
            if (val && posY + y >= 0) {
              ctx.fillStyle = current.color;
              ctx.fillRect((posX + x) * SIZE, (posY + y) * SIZE, SIZE - 1, SIZE - 1);
            }
          });
        });
      }
    }

    // === FIREBASE LEADERBOARD ===
    const leaderboardRef = ref(db, "leaderboard");

    // Load leaderboard in real-time
    onValue(leaderboardRef, (snapshot) => {
      const data = snapshot.val();
      const list = document.getElementById("lb-list");

      if (!data) {
        list.innerHTML = '<li style="color:#8b949e;">No records yet</li>';
        return;
      }

      // Convert to array and sort
      const entries = Object.values(data).sort((a, b) => b.score - a.score).slice(0, 20);

      list.innerHTML = entries.map((entry, i) => {
        const date = new Date(entry.timestamp).toLocaleDateString();
        return `
          <li>
            <span class="lb-name">#${i+1} ${escapeHtml(entry.name)}</span>
            <span class="lb-score">${entry.score}</span>
            <span class="lb-date">${date}</span>
          </li>
        `;
      }).join("");
    });

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Expose to global scope for button onclick
    window.saveScore = function() {
      const nameInput = document.getElementById("player-name");
      const name = nameInput.value.trim() || "Anonymous";

      // Sanitize
      const sanitizedName = name.replace(/[^a-zA-Z0-9_\-\s]/g, "").slice(0, 12);

      // Push to Firebase
      push(leaderboardRef, {
        name: sanitizedName,
        score: score,
        timestamp: Date.now()
      });

      document.getElementById("modal").style.display = "none";
      nameInput.value = "";
    };

    // === GAME OVER ===
    function showGameOver() {
      document.getElementById("final-score").textContent = score;
      document.getElementById("modal").style.display = "flex";
      document.getElementById("player-name").value = "";
      document.getElementById("player-name").focus();
    }

    window.restartGame = function() {
      document.getElementById("modal").style.display = "none";
      init();
    };

    // === CONTROLS ===
    document.addEventListener("keydown", e => {
      if (gameOver) return;
      if (e.code === "ArrowLeft" && !collide(posX - 1, posY)) posX--;
      if (e.code === "ArrowRight" && !collide(posX + 1, posY)) posX++;
      if (e.code === "ArrowDown") drop();
      if (e.code === "ArrowUp") rotate();
    });

    // === GAME LOOP ===
    function loop(timestamp) {
      if (!lastDrop) lastDrop = timestamp;
      if (timestamp - lastDrop > dropInterval) {
        drop();
        lastDrop = timestamp;
      }
      draw();
      requestAnimationFrame(loop);
    }

    // === START ===
    init();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
