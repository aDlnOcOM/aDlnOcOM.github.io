<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11171b">
  <meta name="description" content="Incrementalis — процедурные мегаструктуры.">
  <title>Incrementalis</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/fonts/fonts.bundle.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="world" tabindex="0" aria-label="Мегаструктура"></canvas>
  <div id="menu">
    <button id="start-button" disabled aria-busy="true">Начать</button>
    <button id="save-button" hidden>Сохранить</button>
    <label id="view-settings" hidden for="draw-distance"><span>Дальность прорисовки</span><output id="draw-distance-value" for="draw-distance">Средняя</output><input id="draw-distance" type="range" min="2" max="6" step="1" value="3"></label>
  </div>
  <script>
    function showLoadError() {
      var button = document.getElementById('start-button');
      button.disabled = false; button.textContent = 'Повторить'; button.title = 'Не удалось загрузить файлы';
      button.onclick = function () { location.reload(); };
    }
  </script>
  <script src="./game.bundle.js" onerror="showLoadError()"></script>
</body>
</html>
